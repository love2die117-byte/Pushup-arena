<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Push Up Arena: Knight's Quest S-RANK MASTERY</title>

  <!-- AUTO-UPDATE CACHE BUSTER -->
  <meta name="app-version" content="v16.0-auth-error-feedback">

  <!-- PWA & Mobile Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PushUpArena">
  <meta name="theme-color" content="#0a0b0e">

  <!-- MediaPipe Pose & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0a0b0e;
      --card-bg: #13151b;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-active: rgba(255, 255, 255, 0.35);
      --text: #f1f5f9;
      --subtext: #8b949e;
      --accent-gold: #fbbf24;
      --rank-s: #f43f5e;
      --danger: #f87171;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      z-index: 10;
      background: var(--bg);
      flex-direction: column;
      padding-bottom: 90px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active { display: flex; }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding-bottom: 0;
      justify-content: center;
      align-items: center;
      z-index: 150;
      background: radial-gradient(circle at center, #181b24 0%, #0a0b0e 100%);
      display: flex;
      flex-direction: column;
    }
    .helmet-logo {
      width: 110px;
      height: 110px;
      image-rendering: pixelated;
      margin-bottom: 20px;
      animation: chillFloat 3s infinite ease-in-out;
      filter: drop-shadow(0 0 25px rgba(255,255,255,0.2));
    }
    @keyframes chillFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .loading-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .loading-sub {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 800;
    }
    .progress-bar-bg {
      width: 250px;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #f1f5f9;
      transition: width 0.15s ease;
    }

    .app-header {
      padding: 44px 20px 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(19, 21, 27, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      z-index: 15;
      flex-shrink: 0;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1c1f2b;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #fff;
      overflow: hidden;
    }
    .version-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--subtext);
    }

    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 76px;
      background: #0d0f14;
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: transform 0.15s ease, color 0.15s ease;
      flex: 1;
      padding: 8px 0;
    }
    .nav-item span:first-child {
      font-size: 1.2rem;
      font-family: monospace;
      font-weight: 900;
      transition: transform 0.15s ease;
    }
    .nav-item.active { color: #fff; }
    .nav-item.active span:first-child { transform: scale(1.2); }
    .nav-item:active span:first-child { transform: scale(1.28); }

    .menu-content {
      padding: 24px 20px 40px 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-banner {
      background: linear-gradient(135deg, #171922 0%, #101219 100%);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
